events {}

http {
  # Docker's embedded DNS — required because proxy_pass below uses a captured
  # regex variable ($1), which makes nginx resolve the upstream hostname at
  # request time instead of once at config-load time; without an explicit
  # resolver that mode fails with "no resolver defined".
  resolver 127.0.0.11 valid=30s;

  server {
    listen 80;

    location = /api/v1/health {
      default_type application/json;
      return 200 '{"success":true,"data":{"status":"OK","gateway":"nginx-local"}}';
    }

    location = /api/v1/config {
      default_type application/json;
      return 200 '{"success":true,"data":{"languages":["en","mr"],"features":{"offlineMode":true,"gamification":true,"csrIntegration":true}}}';
    }

    location ~ ^/api/v1/auth/?(.*)$ {
      proxy_pass http://auth:4001/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/users/?(.*)$ {
      proxy_pass http://users:4002/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/master/?(.*)$ {
      proxy_pass http://master:4003/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/homestays/?(.*)$ {
      proxy_pass http://booking:4004/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/restaurants/?(.*)$ {
      proxy_pass http://restaurants:4005/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/tourism/?(.*)$ {
      proxy_pass http://tourism:4006/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/verification/?(.*)$ {
      proxy_pass http://verification:4007/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/admin/?(.*)$ {
      proxy_pass http://admin:4008/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/marketplace/?(.*)$ {
      proxy_pass http://marketplace:4009/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/learning/?(.*)$ {
      proxy_pass http://learning:4010/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/csr/?(.*)$ {
      proxy_pass http://csr:4011/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/events/?(.*)$ {
      proxy_pass http://events:4012/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/blue-economy/?(.*)$ {
      proxy_pass http://blue-economy:4013/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/feedback/?(.*)$ {
      proxy_pass http://feedback:4014/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/rewards/?(.*)$ {
      proxy_pass http://rewards:4015/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

  }
}
