# Local multi-container dev orchestration.
# Usage: docker compose up --build
# Gateway (emulates the future AWS API Gateway routing): http://localhost:8080/api/v1/<domain>/...

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: samudrayan_local
      POSTGRES_USER: samudrayan
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samudrayan"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - users
      - master
      - booking
      - restaurants
      - tourism
      - verification
      - admin
      - marketplace
      - learning
      - csr
      - events
      - blue-economy
      - feedback
      - rewards

  auth:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file:
      - services/auth/.env
    environment:
      PORT: 4001
      SERVICE_NAME: auth-service
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: samudrayan_local
      DB_USER: samudrayan
      DB_PASSWORD: localdevpassword
      DB_SSL: "false"
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  users:
